# Downloads new draws of «6 из 45», «5 из 36» and «Рапидо 2.0» from stoloto.ru, rebuilds the pages and publishes them to the
# main branch, which GitHub Pages serves at https://kuchhh.github.io/portf/ and https://kuchhh.github.io/portf/5x36/
name: Обновление тиражей

on:
  schedule:
    - cron: "8,38 * * * *" # every 30 minutes, a few minutes after each Rapido draw
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Пересобрать страницы, даже если новых тиражей нет"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: draws-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Скачать тиражи «6 из 45»
        id: u645
        continue-on-error: true
        run: python3 lotto-6x45/gosloto645.py update

      - name: Скачать тиражи «5 из 36»
        id: u536
        continue-on-error: true
        run: python3 lotto-5x36/gosloto536.py update

      - name: Скачать тиражи «Рапидо 2.0»
        id: urap
        continue-on-error: true
        run: python3 lotto-rapido2/rapido2.py update

      - name: Пересобрать страницы
        id: build
        run: |
          changed=false
          if [ "${{ inputs.rebuild }}" = "true" ] || ! git diff --quiet -- lotto-6x45/draws_6x45.csv; then
            node lotto-6x45/web/build.js --out .
            changed=true
          fi
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            python3 lotto-5x36/build.py --out 5x36 --full
            changed=true
          elif ! git diff --quiet -- lotto-5x36/draws_5x36.csv lotto-5x36/draws_5x36.meta.json; then
            python3 lotto-5x36/build.py --out 5x36
            changed=true
          fi
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            python3 lotto-rapido2/build.py --out rapido2 --full
            changed=true
          elif ! git diff --quiet -- lotto-rapido2/draws_rapido2.csv lotto-rapido2/draws_rapido2.meta.json; then
            python3 lotto-rapido2/build.py --out rapido2
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Опубликовать
        if: steps.build.outputs.changed == 'true'
        run: |
          a=$(tail -n 1 lotto-6x45/draws_6x45.csv | cut -d, -f1)
          b=$(tail -n 1 lotto-5x36/draws_5x36.csv | cut -d, -f1)
          c=$(tail -n 1 lotto-rapido2/draws_rapido2.csv | cut -d, -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto-6x45/draws_6x45.csv lotto-6x45/draws_6x45.meta.json index.html draws.json \
                  lotto-5x36/draws_5x36.csv lotto-5x36/draws_5x36.meta.json 5x36/index.html 5x36/state.json \
                  lotto-rapido2/draws_rapido2.csv lotto-rapido2/draws_rapido2.meta.json rapido2/index.html rapido2/state.json
          if git diff --cached --quiet; then echo "Нечего публиковать."; exit 0; fi
          git commit -m "Тиражи: 6 из 45 по №$a, 5 из 36 по №$b, Рапидо 2.0 по №$c"
          git push origin HEAD:main

      - name: Сообщить о сбое загрузки
        if: steps.u645.outcome == 'failure' || steps.u536.outcome == 'failure' || steps.urap.outcome == 'failure'
        run: |
          echo "::error::Не удалось скачать тиражи: 6 из 45 — ${{ steps.u645.outcome }}, 5 из 36 — ${{ steps.u536.outcome }}, Рапидо 2.0 — ${{ steps.urap.outcome }}"
          exit 1
